<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <title>Reclaim Capacitor InApp SDK Example</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #000;
        background: #fff;
      }
      .app-bar {
        background-color: #2196F3;
        color: #fff;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
      }
      .safe-area {
        padding-top: env(safe-area-inset-top, 0);
      }
      main {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      label {
        font-size: 16px;
        font-weight: 600;
        color: #000;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      select, input, textarea {
        font-size: 16px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        color: #000;
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        min-height: 120px;
        font-family: monospace;
      }
      button {
        font-size: 16px;
        padding: 12px;
        border-radius: 8px;
        border: 0;
        background-color: #007AFF;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background-color: #6c757d;
      }
      .button-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .button-row button {
        flex: 1;
      }
      #result {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        min-height: 80px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: monospace;
        font-size: 13px;
      }
      .snackbar {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s;
        max-width: 90%;
        pointer-events: none;
      }
      .snackbar.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="safe-area"></div>
    <div class="app-bar">Reclaim Capacitor InApp SDK Example</div>

    <main>
      <div class="field">
        <label for="verificationMode">Verification Mode</label>
        <select id="verificationMode">
          <option value="providerId">Provider ID</option>
          <option value="jsonConfig">JSON Config</option>
          <option value="url">URL</option>
        </select>
      </div>

      <div class="field" id="appIdField">
        <label for="appIdInput">App ID</label>
        <input type="text" id="appIdInput" autocapitalize="none" autocomplete="off" />
      </div>

      <div class="field" id="secretField">
        <label for="secretInput">App Secret</label>
        <input type="text" id="secretInput" autocapitalize="none" autocomplete="off" />
      </div>

      <div class="field">
        <label for="inputText" id="inputLabel">Provider ID</label>
        <input type="text" id="inputText" autocapitalize="none" autocomplete="off" placeholder="Enter Provider ID" />
        <textarea id="inputTextArea" style="display:none" placeholder="Enter JSON Configuration"></textarea>
      </div>

      <div class="field">
        <label for="teeMode">TEE Mode</label>
        <select id="teeMode">
          <option value="auto">Auto</option>
          <option value="enabled" selected>Enabled</option>
          <option value="disabled">Disabled</option>
        </select>
      </div>

      <div class="button-row">
        <button onclick="startVerification()">Start Verification</button>
        <button class="secondary" onclick="ping()">Ping</button>
      </div>

      <div class="field">
        <label>Result (tap to copy)</label>
        <div id="result" onclick="copyResult()"></div>
      </div>
    </main>

    <div id="snackbar" class="snackbar"></div>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
